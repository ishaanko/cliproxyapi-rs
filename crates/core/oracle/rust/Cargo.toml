# Standalone package (own workspace) so the main workspace build never compiles it.
[package]
name = "base-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cpa-core = { path = "../.." }
cpa-json = { path = "../../../json" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
