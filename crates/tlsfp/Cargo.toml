[package]
name = "cpa-tlsfp"
version.workspace = true
edition.workspace = true
license.workspace = true

# BoringSSL-backed TLS ClientHello impersonation (Go: refraction-networking/utls as used by
# executor/helps/utls_client.go and auth/claude/utls_transport.go): the Chrome, Claude Code
# inference and Claude OAuth profiles, proxy dialing (HTTP CONNECT, SOCKS5), the ordered HTTP/1.1
# request writer and a hyper based transport that yields `reqwest::Response`s.
#
# Build requirements (BoringSSL is compiled from source by rama-boring-sys): cmake, a C++
# compiler, and libclang for bindgen. Set `LIBCLANG_PATH` to the directory holding libclang.so
# (for example `uv pip install --target ~/.local/share/libclang libclang`, then
# `LIBCLANG_PATH=~/.local/share/libclang/clang/native`) and, when clang cannot find the compiler
# headers, `BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/x86_64-linux-gnu/<ver>/include`.
[dependencies]
rama-boring = "0.6"
rama-boring-tokio = "0.6"
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
tokio-socks = "0.5"
socket2 = "0.6"
tower-service = "0.3"
url = "2"
brotli = "9"
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

[dev-dependencies]
flate2 = "1"
hyper = { version = "1", features = ["server"] }
