[package]
name = "cpa-execreg"
version.workspace = true
edition.workspace = true
license.workspace = true

# Tracks Home-dispatched executions for one subscriber lifetime (Go: sdk/cliproxy/executionregistry).
# Home mode itself is not part of the Rust build; this is the self-contained bookkeeping layer.
[lib]
name = "cpa_execreg"

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
thiserror.workspace = true
