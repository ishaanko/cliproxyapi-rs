[package]
name = "cpa-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

# Developer command line tools (Go cmd/fetch_*_models, cmd/validate_codex_models). The logic of
# each tool lives in a library module so it can be unit tested; the binaries are thin wrappers.
[lib]
name = "cpa_tools"

[[bin]]
name = "fetch_antigravity_models"
path = "src/bin/fetch_antigravity_models.rs"

[[bin]]
name = "fetch_codex_models"
path = "src/bin/fetch_codex_models.rs"

[[bin]]
name = "fetch_devin_models"
path = "src/bin/fetch_devin_models.rs"

[[bin]]
name = "validate_codex_models"
path = "src/bin/validate_codex_models.rs"

[dependencies]
cpa-json.workspace = true
cpa-core = { path = "../core" }
cpa-config = { path = "../config" }
cpa-auth = { path = "../auth" }
cpa-executors = { path = "../executors" }
cpa-misc = { path = "../misc" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
