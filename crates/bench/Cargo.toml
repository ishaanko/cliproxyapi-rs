[package]
name = "cpa-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Performance benchmark: fast mock upstream, closed-loop load generator and an orchestrator that
# runs the Go reference and the Rust server under identical configs and reports the comparison.
[[bin]]
name = "cpa-bench"
path = "src/main.rs"

# Translator micro-benchmark: wall time, instructions, allocations and bytes per operation of the
# hot conversions on the real benchmark bodies. `cargo run --release -p cpa-bench --bin
# translator-perf [-- filter]`; with `--features prof` and `PROF=1` it also prints a SIGPROF profile.
[[bin]]
name = "translator-perf"
path = "src/perf.rs"

[features]
prof = ["dep:pprof"]

[dependencies]
cpa-translator = { path = "../translator" }
pprof = { version = "0.15", default-features = false, optional = true }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
memchr = "2"
perf-event2 = "0.7"
tokio-tungstenite = "0.29"
