[package]
name = "cpa-pluginstore"
version.workspace = true
edition.workspace = true
license.workspace = true

# Port of internal/pluginstore, sdk/pluginstore and internal/homeplugins: plugin registry
# fetch, GitHub release / direct artifact install, store auth and the CLIProxyAPIHome
# plugin sync/delete reports.
[lib]
name = "cpa_pluginstore"

[dependencies]
cpa-config = { path = "../config" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
async-trait = "0.1"
httpdate = "1"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "socks"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
