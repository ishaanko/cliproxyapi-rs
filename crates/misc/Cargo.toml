[package]
name = "cpa-misc"
version.workspace = true
edition.workspace = true
license.workspace = true

# Small standalone helpers ported from CLIProxyAPI: internal/httpfetch, internal/htmlsanitize,
# internal/httpwire, internal/client/grokbuild and sdk/proxyutil.
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
http = "1"
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
axum = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
