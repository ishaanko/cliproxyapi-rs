[package]
name = "cpa-executors"
version.workspace = true
edition.workspace = true
license.workspace = true

# Provider executors (Go internal/runtime/executor): one module per provider plus `helps`,
# the provider-independent helpers (payload rules, proxy-aware clients, usage extraction,
# SSE line reader, upstream status errors) that every executor builds on.
[features]
# Impersonated TLS ClientHellos (Claude Code for api.anthropic.com, Chrome for chatgpt.com) on
# BoringSSL; needs cmake, a C++ compiler and libclang to build (see crates/tlsfp).
default = ["tls-fingerprint"]
tls-fingerprint = ["dep:cpa-tlsfp", "cpa-auth/tls-fingerprint"]

[dependencies]
cpa-json.workspace = true
cpa-core = { path = "../core" }
cpa-config = { path = "../config" }
cpa-auth = { path = "../auth", default-features = false }
cpa-tlsfp = { path = "../tlsfp", optional = true }
cpa-translator = { path = "../translator" }
cpa-runtime = { path = "../runtime" }
cpa-home = { path = "../home" }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
uuid = { workspace = true, features = ["v5"] }
rand.workspace = true
once_cell.workspace = true
http = "1"
futures-util = "0.3"
base64 = "0.22"
ring = "0.17"
httpdate = "1"
url = "2"
sha1 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
flate2 = "1"
zstd = "0.13"
webpki-roots = "1"
tiktoken-rs = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "gzip", "brotli", "zstd", "deflate", "socks", "stream", "json"] }
aes-gcm = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
axum = "0.8"
flate2 = "1.1.10"
tokio = { workspace = true, features = ["full"] }
