[package]
name = "cpa-executors"
version.workspace = true
edition.workspace = true
license.workspace = true

# Provider executors (Go internal/runtime/executor): one module per provider plus `helps`,
# the provider-independent helpers (payload rules, proxy-aware clients, usage extraction,
# SSE line reader, upstream status errors) that every executor builds on.
[dependencies]
cpa-json.workspace = true
cpa-core = { path = "../core" }
cpa-config = { path = "../config" }
cpa-auth = { path = "../auth" }
cpa-translator = { path = "../translator" }
cpa-runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
uuid = { workspace = true, features = ["v5"] }
rand.workspace = true
once_cell.workspace = true
http = "1"
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22"
ring = "0.17"
httpdate = "1"
url = "2"
tiktoken-rs = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "gzip", "brotli", "deflate", "socks", "stream", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
