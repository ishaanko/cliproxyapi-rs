[package]
name = "cpa-live"
version.workspace = true
edition.workspace = true
license.workspace = true

# Codex live / realtime: SDP call bootstrap, local WebRTC media relay, sideband and direct
# websocket relays, client secrets and capability stubs (Go: internal/client/codex/live).
[dependencies]
cpa-json.workspace = true
cpa-core = { path = "../core" }
cpa-config = { path = "../config" }
cpa-auth = { path = "../auth" }
cpa-runtime = { path = "../runtime" }
cpa-executors = { path = "../executors" }
serde_json.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
regex.workspace = true
rand.workspace = true
base64.workspace = true
uuid.workspace = true
http = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
async-trait = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tokio-socks = "0.5"
webrtc = "0.21.0"
rtc = "0.21.0"
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
tokio-tungstenite = "0.29"
