[package]
name = "cpa-management"
version.workspace = true
edition.workspace = true
license.workspace = true

# Port of internal/api/handlers/management (v8 routes) and the management part of
# internal/api/server_management*.go as an axum Router.
[dependencies]
cpa-config = { path = "../config" }
cpa-auth = { path = "../auth" }
cpa-runtime = { path = "../runtime" }
cpa-core = { path = "../core" }
axum = { version = "0.8", features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
bytes.workspace = true
async-trait = "0.1"
bcrypt = "0.17"
subtle = "2"
url = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "json"] }

tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
