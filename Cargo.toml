[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
indexmap = "2"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpa-json = { path = "crates/json" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 4
