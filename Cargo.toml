[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
indexmap = "2"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpa-json = { path = "crates/json" }

[profile.dev]
debug = 1

# RSA key generation (home enrollment) is unusably slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Fat LTO with one codegen unit: ~3-6% less CPU per request and a ~23% smaller binary than thin LTO
# with 4 units, at the price of a slower link (a release rebuild after touching one crate takes
# minutes, not seconds). `panic = "abort"` is not an option: plugin calls rely on catch_unwind.
# tools/pgo.sh adds profile-guided optimization on top (another 10-15%). Target-cpu stays at the
# portable default: `-C target-cpu=native` measured only ~2% and would make the binary
# non-portable, so it is an opt-in via RUSTFLAGS for builds that run where they were built.
[profile.release]
lto = "fat"
codegen-units = 1

# serde_json with a flat insertion-ordered map instead of IndexMap (see crates/json/vendor/serde_json/src/flatmap.rs)
[patch.crates-io]
serde_json = { path = "crates/json/vendor/serde_json" }
